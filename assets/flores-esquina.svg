<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200">
  <!-- Rama floral de esquina, dibujada para el proyecto Alfaro & Vásquez. -->
  <defs>
    <path id="h" d="M0 0C6-7 16-7.5 23 0C16 7.5 6 7 0 0Z"/>
    <g id="f">
      <circle cx="0" cy="-4" r="3.4"/>
      <circle cx="3.8" cy="-1.2" r="3.4"/>
      <circle cx="2.4" cy="3.3" r="3.4"/>
      <circle cx="-2.4" cy="3.3" r="3.4"/>
      <circle cx="-3.8" cy="-1.2" r="3.4"/>
    </g>
  </defs>

  <!-- Tallos -->
  <g fill="none" stroke="#89967B" stroke-width="1.3" stroke-linecap="round">
    <path d="M-4 20C36 30 72 28 110 15S160 1 182 -2"/>
    <path d="M20 -4C30 34 27 72 15 110S1 160 -2 182"/>
    <path d="M40 27C52 40 58 52 60 68"/>
  </g>

  <!-- Hojas verde salvia -->
  <g fill="#89967B">
    <use href="#h" xlink:href="#h" transform="translate(50 26.5) rotate(40)"/>
    <use href="#h" xlink:href="#h" transform="translate(70 25) rotate(-35)"/>
    <use href="#h" xlink:href="#h" transform="translate(108 15.5) rotate(-40) scale(.9)"/>
    <use href="#h" xlink:href="#h" transform="translate(126 10) rotate(25) scale(.85)"/>
    <use href="#h" xlink:href="#h" transform="translate(165 1) rotate(15) scale(.65)"/>
    <use href="#h" xlink:href="#h" transform="translate(25.5 30) rotate(50)"/>
    <use href="#h" xlink:href="#h" transform="translate(25.5 65) rotate(55)"/>
    <use href="#h" xlink:href="#h" transform="translate(18 100) rotate(60) scale(.9)"/>
    <use href="#h" xlink:href="#h" transform="translate(12 118) rotate(150) scale(.85)"/>
    <use href="#h" xlink:href="#h" transform="translate(3 156) rotate(75) scale(.65)"/>
    <use href="#h" xlink:href="#h" transform="translate(52 42) rotate(-15) scale(.6)"/>
    <use href="#h" xlink:href="#h" transform="translate(56 52) rotate(105) scale(.6)"/>
  </g>

  <!-- Hojas verde oscuro -->
  <g fill="#344C3D" opacity=".75">
    <use href="#h" xlink:href="#h" transform="translate(32 25.5) rotate(-30)"/>
    <use href="#h" xlink:href="#h" transform="translate(88 21.5) rotate(30)"/>
    <use href="#h" xlink:href="#h" transform="translate(146 5) rotate(-35) scale(.75)"/>
    <use href="#h" xlink:href="#h" transform="translate(27 48) rotate(150)"/>
    <use href="#h" xlink:href="#h" transform="translate(22 82) rotate(145)"/>
    <use href="#h" xlink:href="#h" transform="translate(7 138) rotate(65) scale(.75)"/>
  </g>

  <!-- Flores crema con borde dorado -->
  <g fill="#FAF6EE" stroke="#B99A5B" stroke-width=".9">
    <use href="#f" xlink:href="#f" transform="translate(24 22) scale(1.7)"/>
    <use href="#f" xlink:href="#f" transform="translate(48 13) scale(1.05)"/>
    <use href="#f" xlink:href="#f" transform="translate(13 48) scale(1.05)"/>
  </g>

  <!-- Centros y botones dorados -->
  <g fill="#B99A5B">
    <circle cx="24" cy="22" r="3.2"/>
    <circle cx="48" cy="13" r="2"/>
    <circle cx="13" cy="48" r="2"/>
    <circle cx="60" cy="70" r="2.6"/>
    <circle cx="157" cy="9" r="2.1"/>
    <circle cx="9" cy="152" r="2.1"/>
    <circle cx="96" cy="12" r="1.5"/>
    <circle cx="12" cy="94" r="1.5"/>
  </g>
</svg>
